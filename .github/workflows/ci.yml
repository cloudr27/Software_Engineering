name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev]

jobs:
  test:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      # 1. Устанавливаем сам uv (если его нет на self-hosted раннере)
      - name: Установка uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # 2. Синхронизируем зависимости через uv
      # Флаг --all-extras подтянет и dev-зависимости (pytest, httpx и т.д.), если они прописаны в pyproject.toml
      - name: Установка зависимостей
        run: |
          uv sync --all-extras

      # 3. Запускаем тесты. uv run автоматически использует созданное окружение
      - name: Тесты
        run: |
          uv run pytest backend/tests -v