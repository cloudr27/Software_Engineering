name: CD

on:
  push:
    tags: ['v*']

jobs:
  test:
    runs-on: self-hosted
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Установка uv
        uses: astral-sh/setup-uv@v5

      - name: Установка зависимостей
        run: uv sync

      - name: Тесты
        run: uv run pytest -v

  deploy:
    needs: test
    runs-on: self-hosted
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: Установка uv
        uses: astral-sh/setup-uv@v5

      - name: Остановка предыдущей версии
        run: |
          Get-CimInstance Win32_Process |
            Where-Object { $_.CommandLine -like "*helpdesk-deploy*uvicorn*" } |
            ForEach-Object { Stop-Process -Id $_.ProcessId -Force }
          exit 0

      - name: Копирование релиза в папку развёртывания
        run: |
          New-Item -ItemType Directory -Force C:\helpdesk-deploy | Out-Null
          robocopy backend C:\helpdesk-deploy /MIR /XD .venv .pytest_cache __pycache__ tests /XF .env
          if ($LASTEXITCODE -ge 8) { exit 1 } else { exit 0 }

      - name: Установка зависимостей (без dev)
        working-directory: C:\helpdesk-deploy
        run: uv sync --no-dev

      - name: Запуск приложения
        run: |
          Set-Location C:\helpdesk-deploy
          # Запускаем uvicorn.exe НАПРЯМУЮ из .venv, отвязывая процесс через Start-Process
          $uvicorn = "C:\helpdesk-deploy\.venv\Scripts\uvicorn.exe"
          Start-Process -FilePath $uvicorn `
            -ArgumentList "app.main:app", "--host", "127.0.0.1", "--port", "8000" `
            -WorkingDirectory "C:\helpdesk-deploy" `
            -WindowStyle Hidden
          Start-Sleep -Seconds 3

      - name: Проверка работоспособности (smoke test)
        run: |
          Set-Location C:\helpdesk-deploy
          
          # Умное ожидание: стучимся 10 раз по 3 секунды (всего 30 сек)
          $maxAttempts = 10
          $success = $false
          
          for ($i = 1; $i -le $maxAttempts; $i++) {
              Start-Sleep -Seconds 3
              try {
                  $r = Invoke-RestMethod http://127.0.0.1:8000/api/dictionaries/statuses -ErrorAction Stop
                  Write-Host "Ура! Сервер ответил на попытке $i. Статусов: $($r.Count)"
                  $success = $true
                  break
              } catch {
                  Write-Host "Попытка $i из $maxAttempts: сервер еще не поднялся, ждем..."
              }
          }
          
          if (-not $success) {
              Write-Host "Ошибка: сервер не запустился за 30 секунд."
              exit 1
          }